name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

# Cancel older runs of the same branch/PR still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SoundMate.slnx

      - name: Build
        run: dotnet build SoundMate.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test SoundMate.slnx --no-build --configuration Release --verbosity normal
